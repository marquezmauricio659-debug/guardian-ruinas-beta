<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B15-013 · Caza occidental 01 · Prototipo aislado</title>
<style>
*{box-sizing:border-box}body{background:#101c20;color:#e9e1ce;font:16px Georgia,serif;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:30px}small,.note{color:#b8c4be}button,select{background:#28413e;color:#f3e9d3;border:1px solid #ba9b65;padding:12px;border-radius:5px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#1e3032;border:1px solid #64736a;padding:16px;border-radius:8px}.card.target{outline:3px solid #e6b15e}.card.dead{opacity:.4}.bar{height:12px;background:#543838;border-radius:10px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:#92bb82}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#log{height:130px;overflow:auto;background:#18282c;padding:14px;white-space:pre-line}.status{padding:12px;background:#273a36}a{color:#e2be79}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:12px}h1{font-size:24px}}
</style>
<main><h1>Caza occidental 01</h1><p class="note">Prototipo independiente de la campaña. Usa un guardado de prueba separado. No intercambia botín con el mercado real.</p>
<p class="status" id="access"></p><label>Espacio de campaña: <select id="slot"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
<div class="actions"><button id="begin">Entrar al territorio</button><button id="retreat" disabled>Retirada garantizada</button><button id="reset">Reiniciar solo esta prueba</button></div>
<section id="arena" hidden><p class="status" id="hero"></p><div id="enemies" class="grid"></div><div class="actions"><button id="attack">Atacar</button><button id="defend">Defender</button><button id="skill">Golpe de área (20 maná)</button></div><p class="status" id="loot"></p><div id="log" aria-live="polite"></div></section>
<p class="note">Para permitir el acceso: completar el nivel 5 en la partida B15-013 original. Esta prueba no altera los datos guardados de la campaña.</p></main>
<script>
"use strict";
const CAMPAIGN_PREFIX="ruinas-b15-012-save-slot-v1-",HUNT_PREFIX="ruinas-b15-013-caza-test-v1-";
const ROSTER=[{key:"wolf",name:"Lobo de brasa",hp:80,armor:0,attack:14,speed:14,material:"Piel de lobo"},{key:"fox",name:"Zorro de espinas",hp:65,armor:0,attack:12,speed:18,material:"Piel de zorro"},{key:"lynx",name:"Lince de las ruinas",hp:78,armor:1,attack:16,speed:20,material:"Piel de lince"}];
const HEROES={knight:{name:"Espadachín",hp:120,mp:50,attack:28,block:.65},archer:{name:"Arquero",hp:100,mp:60,attack:25,block:.5},ninja:{name:"Ninja",hp:95,mp:65,attack:27,block:.5}};
const el=id=>document.getElementById(id);let game=null,slot=1;
function campaign(n){try{return JSON.parse(localStorage.getItem(CAMPAIGN_PREFIX+n))}catch{return null}}
function unlocked(n){const p=campaign(n)?.levelProgress;return !!(p?.cityUnlocked||p?.completed?.includes(5))}
function key(){return HUNT_PREFIX+slot}
function save(){if(game)localStorage.setItem(key(),JSON.stringify(game))}
function load(){try{const o=JSON.parse(localStorage.getItem(key()));if(o?.version===1&&Array.isArray(o.enemies)&&o.enemies.length===3)return o}catch{}return null}
function note(msg){game.log.unshift(msg);game.log=game.log.slice(0,20)}
function initial(n){const previous=load(),c=campaign(n),id=HEROES[c?.profile?.classId]?c.profile.classId:"knight",h=HEROES[id],saved=c?.state;return {version:1,active:true,finished:false,escaped:false,classId:id,hp:previous?previous.hp:Math.min(h.hp,Math.max(1,Number(saved?.hp)||h.hp)),mp:previous?previous.mp:Math.min(h.mp,Math.max(0,(saved?.mp==null?h.mp:Number(saved.mp)))),round:1,guard:false,loot:previous?.loot||{},enemies:ROSTER.map(e=>({...e,max:e.hp,deadLoot:false})),log:["Entraste al territorio de caza."]}}
function addLoot(e){if(e.deadLoot)return;e.deadLoot=true;game.loot[e.material]=(game.loot[e.material]||0)+1;note("Botín: "+e.material+" ×1")}
function strike(i,damage,area=false){const e=game.enemies[i];if(!e||e.hp<=0)return;let inflicted=Math.max(1,damage-e.armor);e.hp=Math.max(0,e.hp-inflicted);note((area?"Área":"Ataque")+": "+e.name+" recibe "+inflicted);if(e.hp===0)addLoot(e)}
function round(){const living=game.enemies.filter(e=>e.hp>0).sort((a,b)=>b.speed-a.speed);for(const e of living){const dmg=Math.max(1,Math.round(e.attack*(game.guard?.5:1)));game.hp=Math.max(0,game.hp-dmg);note(e.name+" inflige "+dmg+" daño");if(game.hp===0)break}game.guard=false;game.round++;if(game.hp===0){game.active=false;game.finished=true;note("Derrota: la prueba conserva sus materiales y desgaste.")}}
function play(kind,i){if(!game?.active)return;const h=HEROES[game.classId];if(kind==="area"&&game.mp<20)return;if(kind==="area"){game.mp-=20;game.enemies.forEach((e,j)=>{if(e.hp>0)strike(j,22,true)})}else if(kind==="attack"){strike(i,h.attack)}else if(kind==="defend"){game.guard=true;game.mp=Math.min(h.mp,game.mp+10);note("Defensa: se reduce el daño del turno.")}if(game.enemies.every(e=>e.hp===0)){game.active=false;game.finished=true;note("Victoria: territorio despejado.")}else round();save();render()}
function retreat(){if(!game?.active)return;game.active=false;game.escaped=true;note("Retirada garantizada. Conservás materiales, PV y maná de la prueba.");save();render()}
function render(){const ok=unlocked(slot),c=campaign(slot);el("access").textContent=ok?"Nivel 5 completado: acceso disponible.":"Acceso bloqueado: completá el nivel 5 en este espacio.";el("begin").disabled=!ok||!!game?.active;el("retreat").disabled=!game?.active;el("arena").hidden=!game; if(!game)return;const h=HEROES[game.classId];el("hero").textContent=h.name+" · PV "+game.hp+"/"+h.hp+" · Maná "+game.mp+"/"+h.mp+" · Turno "+game.round+" · "+(game.active?"En combate":game.escaped?"Retirada":game.finished?"Finalizado":"En pausa");el("enemies").innerHTML=game.enemies.map((e,i)=>'<div class="card '+(e.hp<=0?'dead':'')+'"><strong>'+e.name+'</strong><div class="bar"><div style="width:'+100*e.hp/e.max+'%"></div></div><p>'+e.hp+'/'+e.max+' PV · Armadura '+e.armor+'</p><button '+(!game.active||e.hp<=0?'disabled':'')+' data-hit="'+i+'">Atacar</button></div>').join("");el("loot").textContent="Materiales: "+(Object.entries(game.loot).map(([k,v])=>k+" ×"+v).join(" · ")||"Ninguno");el("log").textContent=game.log.join("\n");for(const id of ["attack","defend","skill"])el(id).disabled=!game.active;el("skill").disabled||=game.mp<20;el("enemies").querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>play("attack",Number(b.dataset.hit)))}
el("slot").onchange=()=>{slot=Number(el("slot").value);game=load();render()};el("begin").onclick=()=>{if(!unlocked(slot))return;game=initial(slot);save();render()};el("retreat").onclick=retreat;el("reset").onclick=()=>{localStorage.removeItem(key());game=null;render()};el("attack").onclick=()=>{const i=game?.enemies.findIndex(e=>e.hp>0);if(i>=0)play("attack",i)};el("defend").onclick=()=>play("defend");el("skill").onclick=()=>play("area");game=load();render();
</script></html>
